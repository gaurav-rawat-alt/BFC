<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brilliant Financial Consultants | Authorized LIC Advisor</title>

    <!-- SEO -->
    <meta name="description" content="Authorized LIC Advisor offering life insurance, tax saving, and retirement planning solutions. Secure your future with trusted financial guidance." />
    <meta name="keywords" content="LIC agent, life insurance, financial consultant, tax saving, retirement planning, LIC policies India" />
    <meta name="author" content="Brilliant Financial Consultants" />

    <!-- Open Graph (for WhatsApp, Facebook sharing) -->
    <meta property="og:title" content="Brilliant Financial Consultants" />
    <meta property="og:description" content="Authorized LIC Advisor offering trusted financial guidance." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://brilliantfinancialconsultant.com" />
    <meta property="og:image" content="https://brilliantfinancialconsultant.com/images/Logo.png" />

    <!-- Favicon -->
    <link rel="icon" href="/images/Logo.png" />

    <!-- Theme color (mobile browser UI) -->
    <meta name="theme-color" content="#1e3a8a" />

    <!-- Fonts (recommended) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons/css/all/all.css"
    />

    <!-- Performance -->
    <link rel="preload" as="image" href="/images/Logo.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
  </head>

  <body>
    <div id="root"></div>

    <!-- App -->
    <script type="module" src="/src/main.jsx"></script>
